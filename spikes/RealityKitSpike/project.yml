name: RealityKitSpike
options:
  bundleIdPrefix: com.roundgarden.spike
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
targets:
  RealityKitSpike:
    type: application
    platform: [iOS, macOS]
    sources:
      - RealityKitSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roundgarden.spike.renderer
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
