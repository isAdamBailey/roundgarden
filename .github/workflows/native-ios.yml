name: Native iOS build

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - "packages/game-core/**"
      - ".github/workflows/native-ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - "packages/game-core/**"
      - ".github/workflows/native-ios.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict
          apps/shared/*.swift
          apps/ios/Roundgarden/*.swift
          apps/ios/RoundgardenUITests/*.swift
          packages/game-core/Sources/RoundgardenCore/*.swift
          packages/game-core/Tests/RoundgardenCoreTests/*.swift
      - name: Test shared game core
        run: swift test --package-path packages/game-core
      - name: Build and UI-test iOS Simulator target
        run: >-
          xcodebuild -quiet test
          -project apps/ios/Roundgarden.xcodeproj
          -scheme Roundgarden
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          CODE_SIGNING_ALLOWED=NO
