name: Android app

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "package-lock.json"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/web/**"
      - "package-lock.json"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/android.yml"

jobs:
  test:
    # android-emulator-runner can hang on ubuntu-24.04; see its issue #478.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.2"
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: 36
          arch: x86_64
          emulator-build: 15261927
          disable-linux-hw-accel: false
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: cd apps/android && ./gradlew lintDebug assembleDebugAndroidTest
          script: cd apps/android && ./gradlew connectedDebugAndroidTest --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roundgarden-android-debug-and-test-results
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/androidTest-results/connected/debug
            apps/android/app/build/reports/androidTests/connected/debug
