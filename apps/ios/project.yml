name: Roundgarden
groups:
  - apps/shared
options:
  bundleIdPrefix: com.roundgarden
  deploymentTarget:
    iOS: "18.0"
packages:
  RoundgardenCore:
    path: ../../packages/game-core
targets:
  Roundgarden:
    type: application
    platform: iOS
    sources:
      - Roundgarden
      - ../shared
    dependencies:
      - package: RoundgardenCore
        product: RoundgardenCore
    info:
      path: Roundgarden/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.roundgarden
        PRODUCT_NAME: Roundgarden
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roundgarden
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  RoundgardenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RoundgardenUITests
    dependencies:
      - target: Roundgarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.roundgarden.uitests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
