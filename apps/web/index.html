      THESIS: Float at the center of a living 360-degree garden and vaporize nearby oddities into light.
      OWN-WORLD: A whimsical garden surrounds the player, with broad leaves, dangling vines, curling stems, flowers, and vividly colored garden oddities. A soft lime shimmer marks a reachable target.
      STORY: Enter, look all around by dragging, center a nearby oddity, then click or tap to vaporize it into light. A one-minute round rewards valuable oddities and closer timing.
