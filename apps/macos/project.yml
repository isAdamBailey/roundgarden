name: RoundgardenMac
groups:
  - ../shared
options:
  bundleIdPrefix: com.roundgarden
  deploymentTarget:
    macOS: "15.0"
packages:
  RoundgardenCore:
    path: ../../packages/game-core
targets:
  RoundgardenMac:
    type: application
    platform: macOS
    sources:
      - RoundgardenMac
      - ../shared
    dependencies:
      - package: RoundgardenCore
        product: RoundgardenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.roundgarden
        PRODUCT_NAME: Roundgarden
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: RoundgardenMac/RoundgardenMac.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roundgarden
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Adam Bailey"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  RoundgardenMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - RoundgardenMacUITests
    dependencies:
      - target: RoundgardenMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.adambailey.roundgarden.uitests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
